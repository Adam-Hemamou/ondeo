<section
  *ngIf="consent.bannerVisible && !panelOpen"
  class="cookie-banner"
  aria-label="Cookies"
>
  <p>
    {{ i18n.t.cookies.banner }}
    <a [routerLink]="i18n.t.routes.privacy">{{ i18n.t.cookies.learnMore }}</a>
  </p>
  <div class="cookie-actions">
    <button type="button" class="cookie-btn" (click)="consent.refuseAll()">
      {{ i18n.t.cookies.refuse }}
    </button>
    <button type="button" class="cookie-btn" (click)="consent.acceptAll()">
      {{ i18n.t.cookies.accept }}
    </button>
    <button
      type="button"
      class="cookie-btn cookie-btn--secondary"
      (click)="openPanel()"
    >
      {{ i18n.t.cookies.customize }}
    </button>
  </div>
</section>

<dialog
  #panel
  class="cookie-panel"
  aria-labelledby="cookie-panel-title"
  (close)="panelOpen = false"
>
  <h2 id="cookie-panel-title" [innerHTML]="i18n.t.cookies.panelTitle"></h2>
  <p>{{ i18n.t.cookies.panelIntro }}</p>

  <div class="cookie-category">
    <label>
      <input type="checkbox" checked disabled />
      {{ i18n.t.cookies.necessary }}
    </label>
    <p>{{ i18n.t.cookies.necessaryDescription }}</p>
  </div>

  <div class="cookie-category">
    <label>
      <input
        type="checkbox"
        [checked]="draft.statistics"
        (change)="setDraft('statistics', $event)"
      />
      {{ i18n.t.cookies.statistics }}
    </label>
    <p>{{ i18n.t.cookies.statisticsDescription }}</p>
  </div>

  <div class="cookie-category">
    <label>
      <input
        type="checkbox"
        [checked]="draft.marketing"
        (change)="setDraft('marketing', $event)"
      />
      {{ i18n.t.cookies.marketing }}
    </label>
    <p>{{ i18n.t.cookies.marketingDescription }}</p>
  </div>

  <div class="cookie-actions">
    <button type="button" class="cookie-btn" (click)="refuseAll()">
      {{ i18n.t.cookies.refuseAll }}
    </button>
    <button type="button" class="cookie-btn" (click)="acceptAll()">
      {{ i18n.t.cookies.acceptAll }}
    </button>
    <button
      type="button"
      class="cookie-btn cookie-btn--secondary"
      (click)="saveDraft()"
    >
      {{ i18n.t.cookies.save }}
    </button>
  </div>

  <button
    type="button"
    class="cookie-close"
    [attr.aria-label]="i18n.t.cookies.close"
    (click)="closePanel()"
  >
    ×
  </button>
</dialog>
