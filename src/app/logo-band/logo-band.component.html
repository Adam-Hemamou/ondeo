<div class="logos">
  <!-- La liste est affichée deux fois pour le défilement en boucle -->
  <div class="logos-slide">
    <img
      *ngFor="let logo of logos"
      [src]="logo.src"
      [alt]="i18n.t.logoAlt(logo.name)"
      loading="lazy"
    />
  </div>
  <div class="logos-slide">
    <img
      *ngFor="let logo of logos"
      [src]="logo.src"
      [alt]="i18n.t.logoAlt(logo.name)"
      loading="lazy"
    />
  </div>
</div>
