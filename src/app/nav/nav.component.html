<div class="nav-back">
  <div class="nav-bar">
    <div class="logo">
      <span class="logo-name">ONDEO</span>
      <p>{{ i18n.t.nav.tagline }}</p>
    </div>

    <img
      src="/svg/menu.png"
      [alt]="i18n.t.nav.menu"
      role="button"
      tabindex="0"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
      (keydown.enter)="toggleMenu()"
      (keydown.space)="toggleMenu(); $event.preventDefault()"
      loading="lazy"
    />

    <div class="desktop-nav">
      <ul class="desktop-nav">
        <li>
          <a [attr.href]="sectionHref('videos-section')" (click)="scrollToSection('videos-section', $event)">{{ i18n.t.nav.videos }}</a>
        </li>
        <li>
          <a [attr.href]="sectionHref('offers-section')" (click)="scrollToSection('offers-section', $event)">{{ i18n.t.nav.offers }}</a>
        </li>
        <li>
          <a [attr.href]="sectionHref('testimonial-section')" (click)="scrollToSection('testimonial-section', $event)">{{ i18n.t.nav.reviews }}</a>
        </li>
      </ul>
    </div>

    <div class="btn-container">
      <app-language-switcher class="bar-language"></app-language-switcher>
      <button class="notification-button" (click)="scrollToCalendly()">
        {{ i18n.t.nav.book }}
      </button>
    </div>
  </div>

  <div
    [@sharedAnimation]="isMenuOpen ? 'open' : 'closed'"
    [attr.inert]="isMenuOpen ? null : ''"
    class="burger-menu"
  >
    <ul>
      <li (click)="scrollToSection('videos-section', $event)">
        <a [attr.href]="sectionHref('videos-section')">{{ i18n.t.nav.videos }}</a>
      </li>
      <li (click)="scrollToSection('offers-section', $event)">
        <a [attr.href]="sectionHref('offers-section')">{{ i18n.t.nav.offers }}</a>
      </li>
      <li (click)="scrollToSection('testimonial-section', $event)">
        <a [attr.href]="sectionHref('testimonial-section')">{{ i18n.t.nav.reviews }}</a>
      </li>
    </ul>
    <app-language-switcher class="burger-language"></app-language-switcher>
  </div>
</div>
