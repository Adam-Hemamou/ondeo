<div class="podcast-section">
  <h2 class="section-title" [innerHTML]="i18n.t.offers.title"></h2>
  <div id="offers-section"></div>
  <div class="img-bgc">
    <div class="overlay-bgc"></div>
    <div class="title-container">
      <h2 class="pack-title">{{ i18n.t.offers.podcast.title }}</h2>
    </div>
    <p
      class="offer-desc"
      [innerHTML]="i18n.t.offers.podcast.description"
    ></p>
  </div>

  <div *ngIf="isMobile; else desktopLayout">
    <swiper [config]="config">
      <ng-container>
        <ng-template swiperSlide>
          <app-offer-card
            [offer]="whiteOfferCards"
            [isMobile]="isMobile"
          ></app-offer-card>
        </ng-template>
        <ng-template swiperSlide>
          <app-offer-card
            [offer]="blackOffercard"
            [isMobile]="isMobile"
          ></app-offer-card>
        </ng-template>
      </ng-container>
    </swiper>
  </div>
  <ng-template #desktopLayout>
    <div class="offer-cards">
      <app-offer-card
        [offer]="whiteOfferCards"
        [isMobile]="isMobile"
      ></app-offer-card>
      <app-offer-card
        [offer]="blackOffercard"
        [isMobile]="isMobile"
      ></app-offer-card>
    </div>
  </ng-template>
</div>
