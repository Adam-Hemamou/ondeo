<section class="discussion-section">
  <div class="blue-background"></div>

  <div class="footer-container">
    <div class="need-talk">
      <h2 class="footer-title mb-20">{{ i18n.t.contact.title }}</h2>

      <p class="description" [innerHTML]="i18n.t.contact.description"></p>

      <div class="steps-container">
        <ul class="steps">
          <li>
            <img src="/png/correction-white.png" alt="" loading="lazy" />
            <p>{{ i18n.t.contact.stepSlot }}</p>
          </li>
          <li id="calendly-section">
            <img src="/png/correction-white.png" alt="" loading="lazy" />
            <p>{{ i18n.t.contact.stepTalk }}</p>
          </li>
          <li>
            <img src="/png/correction-white.png" alt="" loading="lazy" />
            <p>{{ i18n.t.contact.stepProduction }}</p>
          </li>
        </ul>
      </div>
    </div>
    <div
      #widget
      id="footer-section"
      class="calendly-inline-widget"
      data-url="https://calendly.com/robin-ondeo-agency/30min?hide_event_type_details=1&hide_gdpr_banner=1"
      style="width: 100%; max-width: 600px; height: 600px; margin: 0 auto"
    >
      <div *ngIf="!widgetLoaded && !consentGiven" class="calendly-placeholder">
        <p>{{ i18n.t.contact.calendarNotice }}</p>
        <button type="button" class="rdv-btn" (click)="loadWidget()">
          {{ i18n.t.contact.showCalendar }}
        </button>
      </div>
    </div>
  </div>
  <footer class="footer">
    <p class="follow-us">{{ i18n.t.contact.followUs }}</p>
  </footer>
</section>
