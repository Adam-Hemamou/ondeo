<div class="img-bgc">
  <div class="overlay-bgc"></div>

  <div class="title-container">
    <h2 class="pack-title">{{ i18n.t.offers.motion.title }}</h2>
  </div>
  <p class="offer-desc">{{ i18n.t.offers.motion.description }}</p>
</div>

<div *ngIf="isMobile; else desktopLayout">
  <swiper [config]="config">
    <ng-template *ngFor="let offer of offerCards" swiperSlide>
      <app-offer-card [offer]="offer"></app-offer-card>
    </ng-template>
  </swiper>
</div>
<ng-template #desktopLayout>
  <div class="offer-cards">
    <app-offer-card
      *ngFor="let offer of offerCards"
      [offer]="offer"
    ></app-offer-card>
  </div>
</ng-template>
